##############################################################################
# Phase 13 — n8n Workflow Automation (Queue Mode)
#
# Topology:
#   n8n-main    : UI, webhook reception, job dispatch → Redis queue
#   n8n-worker  : pulls jobs from Redis, executes workflow nodes
#   redis       : BullMQ queue broker (ephemeral job state)
#   n8n-postgres: n8n-owned DB (workflow definitions, execution history)
#
# Networks:
#   n8n_internal           : private bus between n8n, Redis, Postgres
#   eduaiplatform_internal : shared with root compose so FastAPI can reach n8n
#
# Bring up:
#   docker compose -f infra/n8n/docker-compose.yml --env-file infra/n8n/.env up -d
##############################################################################

name: eduai-n8n

services:

  # --------------------------------------------------------------------------
  # n8n-postgres
  # --------------------------------------------------------------------------
  n8n-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${N8N_DB_NAME:-n8n}
      POSTGRES_USER:     ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      postgres
      -c max_connections=64
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c wal_level=minimal
      -c max_wal_senders=0
    deploy:
      resources:
        limits:
          memory: 512M

  # --------------------------------------------------------------------------
  # Redis — BullMQ queue broker
  # --------------------------------------------------------------------------
  n8n-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --loglevel warning
    volumes:
      - n8n_redis_data:/data
    networks:
      - n8n_internal
      - eduaiplatform_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 320M

  # --------------------------------------------------------------------------
  # n8n-main — UI, webhooks, job dispatch (does NOT run Code nodes)
  # --------------------------------------------------------------------------
  n8n-main:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      # -- Execution mode -------------------------------------------------------
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      QUEUE_BULL_REDIS_DB: 0
      QUEUE_BULL_REDIS_TIMEOUT_THRESHOLD: 10000

      # -- Database -------------------------------------------------------------
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_SSL_ENABLED: "false"

      # -- Security / encryption ------------------------------------------------
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # -- Code node sandbox ----------------------------------------------------
      # NODE_FUNCTION_ALLOW_BUILTIN : expose crypto + buffer inside Code nodes
      # N8N_BLOCK_ENV_ACCESS_IN_NODE: allow $env['...'] reads in Code nodes
      # N8N_WEBHOOK_HMAC_SECRET     : secret read by HMAC Code nodes via $env
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto,buffer"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_WEBHOOK_HMAC_SECRET: "${N8N_WEBHOOK_HMAC_SECRET:-dev_n8n_webhook_secret}"
      BACKEND_INTERNAL_URL: "${BACKEND_INTERNAL_URL:-http://host.docker.internal:8000}"
      BACKEND_INTERNAL_SECRET: "${BACKEND_INTERNAL_SECRET:-dev_backend_internal_secret}"

      # -- User management ------------------------------------------------------
      N8N_USER_MANAGEMENT_DISABLED: "false"

      # -- Instance identity ----------------------------------------------------
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN: "true"

      # -- Execution limits -----------------------------------------------------
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "true"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE: "true"

      # -- Timezone + logging ---------------------------------------------------
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_LOG_LEVEL: warn
      N8N_LOG_OUTPUT: console
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n_internal
      - eduaiplatform_internal
    healthcheck:
      test: >
        wget --no-verbose --tries=1 --spider http://localhost:5678/healthz
        || exit 1
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  # --------------------------------------------------------------------------
  # n8n-worker — executes Code nodes and workflow jobs from the queue
  # --------------------------------------------------------------------------
  n8n-worker:
    image: n8nio/n8n:latest
    restart: unless-stopped
    command: worker --concurrency=4
    environment:
      # -- Execution mode -------------------------------------------------------
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      QUEUE_BULL_REDIS_DB: 0

      # -- Database -------------------------------------------------------------
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_SSL_ENABLED: "false"

      # -- Security / encryption ------------------------------------------------
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # -- Code node sandbox (identical to n8n-main) ----------------------------
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto,buffer"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_WEBHOOK_HMAC_SECRET: "${N8N_WEBHOOK_HMAC_SECRET:-dev_n8n_webhook_secret}"
      BACKEND_INTERNAL_URL: "${BACKEND_INTERNAL_URL:-http://host.docker.internal:8000}"
      BACKEND_INTERNAL_SECRET: "${BACKEND_INTERNAL_SECRET:-dev_backend_internal_secret}"

      # -- Worker settings ------------------------------------------------------
      QUEUE_WORKER_TIMEOUT: 300
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: 30

      # -- Limits ---------------------------------------------------------------
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all

      # -- Timezone + logging ---------------------------------------------------
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_LOG_LEVEL: warn
      N8N_LOG_OUTPUT: console
      N8N_DIAGNOSTICS_ENABLED: "false"

    depends_on:
      n8n-main:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n_internal
      - eduaiplatform_internal
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  n8n_internal:
    driver: bridge

  eduaiplatform_internal:
    external: true
    name: eduaiplatform_internal

# ------------------------------------------------------------------------------
# Volumes
# ------------------------------------------------------------------------------
volumes:
  n8n_postgres_data:
    driver: local
  n8n_redis_data:
    driver: local
  n8n_data:
    driver: local
